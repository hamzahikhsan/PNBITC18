/* ============================================================
   BUTTON — identik dgn design system: radius-full, hero/md/sm/xs
   ============================================================ */
const MButton = ({ children, variant = 'primary', size = 'md', fullWidth = false, onClick, disabled = false, isLoading = false, className = '' }) => {
    const base = "inline-flex items-center justify-center gap-2 font-bold transition-all duration-200 active:scale-[0.97] disabled:active:scale-100 disabled:opacity-60 disabled:cursor-not-allowed select-none rounded-full";
    const sizes = { hero: "h-[52px] px-6 text-[15px]", md: "h-12 px-6 text-[14px]", sm: "h-10 px-4 text-[13px]", xs: "h-8 px-3 text-[12px]" };
    const width = fullWidth ? "w-full" : "w-fit";
    const variants = {
        primary: "bg-[#00AA13] text-white shadow-[0_4px_12px_rgba(0,170,19,0.2)] hover:bg-[#049F16]",
        secondary: "bg-white text-[#14181A] border border-[#E8EBEA] shadow-sm hover:bg-[#F8FAFA]",
        outline: "bg-transparent text-[#00AA13] border border-[#00AA13] hover:bg-[#E3F7E4]",
        ghost: "bg-transparent text-[#5C6668] hover:bg-[#F8FAFA]",
        destructive: "bg-[#D42F2F] text-white shadow-[0_4px_12px_rgba(212,47,47,0.2)] hover:bg-[#B82727]",
        destructiveOutline: "bg-white text-[#D42F2F] border border-[#E8EBEA] shadow-sm hover:bg-[#FCE7E7]",
    };
    return (
        <button onClick={onClick} disabled={disabled || isLoading} className={`${base} ${sizes[size]} ${width} ${variants[variant]} ${className}`}>
            {isLoading ? <div className="w-5 h-5 border-2 border-current border-t-transparent rounded-full animate-spin"/> : children}
        </button>
    );
};

const NumericKeypad = ({ onDigit, onBackspace }) => {
    const rows = [
        [{ n: '1', l: '' }, { n: '2', l: 'ABC' }, { n: '3', l: 'DEF' }],
        [{ n: '4', l: 'GHI' }, { n: '5', l: 'JKL' }, { n: '6', l: 'MNO' }],
        [{ n: '7', l: 'PQRS' }, { n: '8', l: 'TUV' }, { n: '9', l: 'WXYZ' }],
    ];
    const Key = ({ n, l, onClick, children }) => (
        <button onClick={onClick} className="h-14 flex flex-col items-center justify-center rounded-xl bg-white active:bg-[#F4F6F6] transition-colors shadow-[0_1px_2px_rgba(0,0,0,0.05)] border border-[#E8EBEA]">
            {children ? children : (
                <>
                    <span className="text-[22px] font-extrabold text-[#14181A] leading-none">{n}</span>
                    {l && <span className="text-[9px] text-[#8D9699] tracking-widest mt-0.5">{l}</span>}
                </>
            )}
        </button>
    );
    return (
        <div className="bg-[#F4F6F6] px-4 pt-3 pb-safe grid grid-cols-3 gap-2 shrink-0 border-t border-[#F0F3F2]">
            {rows.flat().map(k => <Key key={k.n} n={k.n} l={k.l} onClick={() => onDigit(k.n)} />)}
            <div />
            <Key n="0" onClick={() => onDigit('0')} />
            <Key onClick={onBackspace}><Icon.Delete size={22} color="#5C6668" /></Key>
        </div>
    );
};

const StatusStepper = ({ steps, currentIndex }) => (
    <div className="flex flex-col">

/* ============================================================
   INVOICE EDITOR — input harga final + rincian (Barang Besar)
   ============================================================ */
const InvoiceEditor = ({ items, onItemsChange, onSubmit, isLoading = false }) => {
    const [localItems, setLocalItems] = useState(items || [{ id: 1, name: '', price: '' }]);
    const update = (id, field, val) => {
        const next = localItems.map(it => it.id === id ? { ...it, [field]: val } : it);
        setLocalItems(next);
        onItemsChange && onItemsChange(next);
    };
    const addItem = () => setLocalItems([...localItems, { id: Date.now(), name: '', price: '' }]);
    const removeItem = (id) => setLocalItems(localItems.filter(it => it.id !== id));
    const total = localItems.reduce((sum, it) => sum + (parseInt(String(it.price).replace(/\D/g, '')) || 0), 0);

    return (
        <div>
            <div className="flex flex-col gap-3">
                {localItems.map((it, i) => (
                    <div key={it.id} className="flex gap-2 items-start">
                        <div className="flex-1 flex flex-col gap-1.5">
                            <input
                                value={it.name}
                                onChange={(e) => update(it.id, 'name', e.target.value)}
                                placeholder={i === 0 ? 'Contoh: Jasa servis kompresor' : 'Contoh: Sparepart kapasitor'}
                                className="h-11 rounded-lg border border-[#E8EBEA] px-3.5 text-[13px] font-semibold text-[#14181A] placeholder:text-[#8D9699] placeholder:font-medium focus:border-primary-default outline-none"
                            />
                            <div className="relative">
                                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[13px] font-semibold text-[#8D9699]">Rp</span>
                                <input
                                    value={it.price}
                                    onChange={(e) => update(it.id, 'price', e.target.value.replace(/\D/g, ''))}
                                    placeholder="0"
                                    inputMode="numeric"
                                    className="w-full h-11 rounded-lg border border-[#E8EBEA] pl-9 pr-3.5 text-[13px] font-bold text-[#14181A] font-mono placeholder:text-[#8D9699] placeholder:font-medium focus:border-primary-default outline-none"
                                />
                            </div>
                        </div>
                        {localItems.length > 1 && (
                            <button onClick={() => removeItem(it.id)} className="w-11 h-11 rounded-lg bg-[#FCE7E7] flex items-center justify-center shrink-0 mt-0"><Icon.Trash size={16} color="#D42F2F" /></button>
                        )}
                    </div>
                ))}
            </div>
            <button onClick={addItem} className="flex items-center gap-1.5 mt-3 text-[12px] font-extrabold text-primary-default press-scale">
                <Icon.Plus size={14} /> Tambah Rincian
            </button>
            <div className="mt-4 pt-4 border-t border-dashed border-[#E8EBEA] flex items-center justify-between">
                <span className="text-[13px] font-bold text-[#5C6668]">Total Tagihan</span>
                <span className="text-[20px] font-extrabold text-[#14181A] font-mono">Rp{total.toLocaleString('id-ID')}</span>
            </div>
            <MButton fullWidth className="mt-4" onClick={() => onSubmit(localItems, total)} disabled={total === 0 || localItems.some(it => !it.name)} isLoading={isLoading}>Kirim Invoice ke Pelanggan</MButton>
        </div>
    );
};

const OtpEntryScreen = ({ phone, onBack, onVerified }) => {
    const [otp, setOtp] = useState('');
    const [status, setStatus] = useState('idle');
    const [countdown, setCountdown] = useState(60);
    const [loading, setLoading] = useState(false);
    const CORRECT_OTP = '1234';

    useEffect(() => {
        if (countdown <= 0) return;
        const t = setTimeout(() => setCountdown(c => c - 1), 1000);
        return () => clearTimeout(t);
    }, [countdown]);

    useEffect(() => {
        if (otp.length === 4) {
            setLoading(true);
            setTimeout(() => {
                setLoading(false);
                if (otp === CORRECT_OTP) { setStatus('success'); setTimeout(onVerified, 400); }
                else { setStatus('error'); setTimeout(() => { setOtp(''); setStatus('idle'); }, 900); }
            }, 700);
        }
    }, [otp]);

    const onDigit = (d) => { if (otp.length < 4 && status !== 'error') setOtp(otp + d); };
    const onBackspace = () => setOtp(otp.slice(0, -1));

    return (
        <div className="h-full w-full flex flex-col bg-white">
            <MTopBar onBack={onBack} />
            <div className="flex-1 overflow-y-auto no-scrollbar px-6 pt-2 flex flex-col items-center text-center">
                <h1 className="text-[22px] font-extrabold text-[#14181A] mb-2">Masukkan Kode Verifikasi</h1>
                <p className="text-[13px] text-[#5C6668] leading-relaxed mb-8">Kode 4 digit dikirim ke <span className="font-bold text-[#14181A]">+62 {phone}</span></p>
                <OTPInputField length={4} value={otp} status={status} />
                {status === 'error' && <p className="text-[12px] font-semibold text-error-default mt-3">Kode salah, coba lagi.</p>}
                {loading && <div className="w-5 h-5 mt-4 border-2 border-primary-default border-t-transparent rounded-full animate-spin" />}

                <div className="mt-8">
                    {countdown > 0 ? (
                        <p className="text-[13px] text-[#8D9699]">Kirim ulang kode dalam <span className="font-bold text-[#14181A] font-mono">00:{String(countdown).padStart(2, '0')}</span></p>
                    ) : (
                        <button onClick={() => setCountdown(60)} className="text-[13px] font-extrabold text-primary-default press-scale">Kirim Ulang Kode</button>
                    )}
                </div>
                <p className="text-[11px] text-[#8D9699] mt-8">Untuk kebutuhan simulasi, gunakan kode <span className="font-mono font-bold text-[#5C6668]">1234</span></p>
            </div>
            <NumericKeypad onDigit={onDigit} onBackspace={onBackspace} />
        </div>
    );
};

const OnboardingUsahaFlow = ({ onApproved }) => {
    const [step, setStep] = useState(0); // 0..5 form, 6 pending, 7 approved/rejected
    const [phase, setPhase] = useState('form'); // form | pending | approved | rejected
    const [data, setData] = useState({ categories: [], dataDasar: null, consentPribadi: false, consentLokasi: false, docs: null, prices: null });

    const stepsMeta = ['Kategori', 'Data Dasar', 'Consent Data Pribadi', 'Consent Data Lokasi', 'Upload Dokumen', 'Kisaran Harga'];
    const totalSteps = stepsMeta.length;

    const goBack = () => { if (step === 0) return; setStep(step - 1); };
    const next = (patch) => { setData(d => ({ ...d, ...patch })); setStep(s => { const ns = s + 1; if (ns >= totalSteps) setPhase('pending'); return ns; }); };

    if (phase === 'pending') {
        return <VerificationPendingScreen onFinishApproved={() => setPhase('approved')} onShowRejectedDemo={() => setPhase('rejected')} />;
    }
    if (phase === 'approved') {
        return <VerificationApprovedScreen onEnter={() => onApproved(data)} />;
    }
    if (phase === 'rejected') {
        return <VerificationRejectedScreen onBack={() => setPhase('pending')} onFixStep={(target) => { setPhase('form'); setStep(4); }} />;
    }

    const common = { onBack: goBack, stepIndex: step, totalSteps };
    if (step === 0) return <CategoryStep {...common} value={data.categories} onNext={(v) => next({ categories: v })} />;
    if (step === 1) return <DataDasarStep {...common} value={data.dataDasar} onNext={(v) => next({ dataDasar: v })} />;
    if (step === 2) return <ConsentStep {...common} title="Consent Data Pribadi" explainText="Kami perlu menyimpan data KTP-mu untuk verifikasi identitas mitra, sesuai UU Perlindungan Data Pribadi (UU PDP). Data ini tidak akan dibagikan ke pihak lain tanpa izinmu." consentLabel="Saya menyetujui penggunaan data pribadi saya (KTP) untuk keperluan verifikasi." onNext={(v) => next({ consentPribadi: v })} />;
    if (step === 3) return <ConsentStep {...common} title="Consent Data Lokasi" explainText="Kami perlu data lokasi usahamu agar bisa ditampilkan ke pelanggan di sekitar dan membantu proses verifikasi alamat, sesuai UU PDP." consentLabel="Saya menyetujui penggunaan data lokasi usaha saya." onNext={(v) => next({ consentLokasi: v })} />;
    if (step === 4) return <UploadDocStep {...common} value={data.docs} onNext={(v) => next({ docs: v })} />;
    if (step === 5) return <HargaStep {...common} categories={data.categories.length ? data.categories : ['elektronik']} value={data.prices} onNext={(v) => next({ prices: v })} />;
    return null;
};

    const canCancel = isBesar ? ['diterima', 'berangkat', 'tiba', 'verifikasi', 'cek_fisik', 'invoice'].includes(order.status) : ['menunggu_antar', 'diterima'].includes(order.status);

    const advance = (patch) => onUpdateOrder(order.id, patch);

    const submitVerification = () => {
        if (otpVal === order.verificationCode) {
            setOtpStatus('success');
            setTimeout(() => advance({ status: 'cek_fisik' }), 500);
        } else {
            setOtpStatus('error');
            setTimeout(() => { setOtpVal(''); setOtpStatus('idle'); }, 800);
        }
    };
    useEffect(() => { if (otpVal.length === 4) submitVerification(); }, [otpVal]);

    const submitInvoice = (items, total) => {
        advance({ status: 'invoice', invoiceItems: items, invoiceTotal: total });
        setInvoiceWaiting(true);
        setTimeout(() => { setInvoiceWaiting(false); advance({ status: 'dikerjakan' }); showToast('Invoice disetujui pelanggan!'); }, 2200);
    };

    const confirmCancel = (reason) => {
        advance({ status: 'dibatalkan', cancelReason: reason, isFullyDone: true });
        setCancelModal(false);
        showToast('Pesanan dibatalkan. Pelanggan direfund otomatis.');
        setTimeout(onBack, 900);
    };

    const submitRating = (rating) => {
        advance({ customerRatingGiven: true, customerRating: rating });
        setRateSheet(false);
        showToast('Terima kasih atas penilaianmu!');
    };

    const finalizeOrder = () => {
        advance({ isFullyDone: true });
        onFinishOrder(order);
        setTimeout(onBack, 300);
    };

    return (
        <div className="h-full w-full flex flex-col bg-background overflow-hidden relative">
            <MTopBar onBack={onBack} title={order.id} right={
                <button onClick={onChatCustomer} className="w-9 h-9 rounded-full bg-[#F4F6F6] flex items-center justify-center press-scale"><Icon.MessageCircle size={17} color="#14181A" /></button>
            } />
            <div className="flex-1 overflow-y-auto no-scrollbar px-5 py-5 flex flex-col gap-4">

                {/* Info Pelanggan */}
                <div className="bg-white rounded-2xl border border-[#E8EBEA] p-4">
                    <div className="flex items-center gap-3 mb-3">
                        <img src={order.customerAvatar} alt="" className="w-11 h-11 rounded-full object-cover" />
                        <div className="flex-1 min-w-0">
                            <p className="text-[14px] font-extrabold text-[#14181A] truncate">{order.customerName}</p>
                            <p className="text-[11.5px] text-[#8D9699]">{order.customerPhone}</p>
                        </div>
                        <StatusBadge status={order.status} />
                    </div>
                    <div className="flex gap-2 items-start text-[12px] text-[#5C6668] leading-relaxed">
                        <Icon.MapPin size={14} color="#8D9699" className="shrink-0 mt-0.5" />
                        <span>{order.address}</span>
                    </div>
                </div>

                {/* Info Barang */}
                <div className="bg-white rounded-2xl border border-[#E8EBEA] p-4 flex gap-3">
                    <img src={order.photo} alt="" className="w-16 h-16 rounded-xl object-cover shrink-0 border border-[#E8EBEA]" />
                    <div className="flex-1 min-w-0">
                        <p className="text-[14px] font-extrabold text-[#14181A]">{order.itemName}</p>
                        <p className="text-[12px] text-[#5C6668] mt-0.5 leading-relaxed">{order.issue}</p>
                        <p className="text-[11px] font-bold text-primary-default mt-1.5">{order.estimatedPrice}</p>
                    </div>
                </div>

                {/* Stepper */}
                {order.status !== 'dibatalkan' && order.status !== 'ditolak' && (
                    <div className="bg-white rounded-2xl border border-[#E8EBEA] p-4">
                        <h4 className="text-[13px] font-extrabold text-[#14181A] mb-4">Progres Pesanan</h4>
                        <StatusStepper steps={steps} currentIndex={currentIndex} />
                    </div>
                )}

                {order.status === 'dibatalkan' && (
                    <div className="bg-error-container rounded-2xl p-4 flex gap-3">
                        <Icon.AlertOctagon size={20} color="#D42F2F" />
                        <div>
                            <p className="text-[13px] font-extrabold text-error-default">Pesanan Dibatalkan</p>
                            <p className="text-[12px] text-error-default/90 mt-0.5">Alasan: {order.cancelReason}. Pelanggan telah direfund penuh.</p>
                        </div>
                    </div>
                )}

                {/* ===== Panel Aksi Sesuai Tahap ===== */}
                {order.status === 'diterima' && isBesar && (
                    <MButton fullWidth onClick={() => advance({ status: 'berangkat' })}>Berangkat ke Lokasi</MButton>
                )}

                {order.status === 'menunggu_antar' && !isBesar && (
                    <MButton fullWidth onClick={() => advance({ status: 'diterima' })}>Tandai Barang Sudah Diterima</MButton>
                )}

                {order.status === 'berangkat' && (
                    <div className="flex flex-col gap-3">
                        <LiveTrackingMap />
                        <MButton fullWidth onClick={() => advance({ status: 'tiba' })}>Saya Sudah Tiba di Lokasi</MButton>
                    </div>
                )}

                {order.status === 'tiba' && (
                    <div className="bg-white rounded-2xl border border-[#E8EBEA] p-4">
                        <h4 className="text-[13.5px] font-extrabold text-[#14181A] mb-1">Verifikasi Kode Kedatangan</h4>
                        <p className="text-[12px] text-[#5C6668] leading-relaxed mb-4">Minta pelanggan menyebutkan kode 4 digit yang muncul di aplikasi Awetin mereka.</p>
                        <OTPInputField length={4} value={otpVal} status={otpStatus} />
                        {otpStatus === 'error' && <p className="text-[12px] font-semibold text-error-default text-center mt-2">Kode salah. Coba tanyakan ulang ke pelanggan.</p>}
                        <div className="grid grid-cols-3 gap-2 mt-4">
                            {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k, i) => k === '' ? <div key={i} /> : (
                                <button key={i} onClick={() => k === '⌫' ? setOtpVal(v => v.slice(0, -1)) : setOtpVal(v => v.length < 4 ? v + k : v)} className="h-11 rounded-lg bg-[#F4F6F6] font-extrabold text-[15px] text-[#14181A] active:bg-[#E8EBEA]">{k}</button>
                            ))}
                        </div>
                    </div>
                )}

                {order.status === 'cek_fisik' && (
                    <MButton fullWidth onClick={() => advance({ status: 'invoice' })}>Sudah Cek Fisik, Lanjut Buat Invoice</MButton>
                )}

                {order.status === 'invoice' && (
                    <div className="bg-white rounded-2xl border border-[#E8EBEA] p-4">
                        {invoiceWaiting ? (
                            <div className="flex flex-col items-center text-center py-4">
                                <div className="w-9 h-9 border-2 border-primary-default border-t-transparent rounded-full animate-spin mb-3" />
                                <p className="text-[13px] font-bold text-[#14181A]">Menunggu Respons Pelanggan…</p>
                                <p className="text-[11.5px] text-[#8D9699] mt-1">Invoice terkirim, menunggu persetujuan.</p>
                            </div>
                        ) : order.invoiceTotal ? (
                            <div className="flex flex-col items-center text-center py-4">
                                <div className="w-9 h-9 border-2 border-primary-default border-t-transparent rounded-full animate-spin mb-3" />
                                <p className="text-[13px] font-bold text-[#14181A]">Invoice Terkirim, Menunggu Respons</p>
                            </div>
                        ) : (
                            <>
                                <h4 className="text-[13.5px] font-extrabold text-[#14181A] mb-3">Input Harga Final</h4>
                                <InvoiceEditor onSubmit={submitInvoice} />
                            </>
                        )}
                    </div>
                )}

                {order.status === 'dikerjakan' && (
                    <MButton fullWidth onClick={() => advance({ status: 'selesai_upload' })}>Tandai Selesai & Unggah Bukti</MButton>
                )}

                {order.status === 'selesai_upload' && (
                    <BeforeAfterUploadPanel order={order} onDone={(before, after) => advance({ status: 'serah_terima', beforePhoto: before, afterPhoto: after })} />
                )}

                {order.status === 'serah_terima' && !order.isFullyDone && (
                    <div className="flex flex-col gap-3">
                        {order.beforePhoto && order.afterPhoto && (
                            <div className="bg-white rounded-2xl border border-[#E8EBEA] p-4">
                                <h4 className="text-[13px] font-extrabold text-[#14181A] mb-3">Foto Sebelum & Sesudah</h4>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><img src={order.beforePhoto} className="w-full aspect-square object-cover rounded-lg" /><p className="text-[10px] text-center text-[#8D9699] mt-1 font-semibold">Sebelum</p></div>
                                    <div><img src={order.afterPhoto} className="w-full aspect-square object-cover rounded-lg" /><p className="text-[10px] text-center text-[#8D9699] mt-1 font-semibold">Sesudah</p></div>
                                </div>
                            </div>
                        )}
                        {isBesar && <PaymentConfirmCard confirmed={order.paymentConfirmed} method={order.paymentMethod}
                            onConfirmQris={() => { advance({ paymentConfirmed: true, paymentMethod: 'qris' }); showToast('Pembayaran QRIS terverifikasi.'); }}
                            onConfirmCash={() => { advance({ paymentConfirmed: true, paymentMethod: 'cash' }); showToast('Ditandai sudah diterima tunai.'); }} />}
                        {!isBesar && (
                            <div className="bg-[#F8FAFA] rounded-2xl p-3.5 flex gap-2">
                                <Icon.Info size={16} color="#8D9699" />
                                <p className="text-[11.5px] text-[#8D9699] leading-relaxed">Pembayaran servis ini disepakati & diterima langsung dari pelanggan (di luar aplikasi), sesuai kesepakatan awal lewat chat.</p>
                            </div>
                        )}

                        <div className="bg-white rounded-2xl border border-[#E8EBEA] p-4">
                            <h4 className="text-[13px] font-extrabold text-[#14181A] mb-2">Nilai Pelanggan</h4>
                            {order.customerRatingGiven ? (
                                <div className="flex items-center gap-2"><RatingStars value={order.customerRating?.stars || 0} size={16} /><span className="text-[12px] font-semibold text-[#5C6668]">Penilaian tersimpan</span></div>
                            ) : (
                                <MButton variant="outline" size="sm" onClick={() => setRateSheet(true)}>Beri Penilaian</MButton>
                            )}
                        </div>

                        <MButton fullWidth onClick={finalizeOrder} disabled={isBesar && !order.paymentConfirmed}>Selesaikan Pesanan</MButton>
                    </div>
                )}

                {order.status === 'serah_terima' && order.isFullyDone && (
                    <div className="bg-success-container rounded-2xl p-4 flex gap-3">
                        <Icon.CheckCircle filled size={22} color="#1E9E4A" />
                        <p className="text-[13px] font-bold text-success-default">Pesanan ini telah selesai & tercatat di riwayat.</p>
                    </div>
                )}

                {canCancel && (
                    <button onClick={() => setCancelModal(true)} className="text-center text-[12.5px] font-extrabold text-error-default press-scale mt-1 pb-4">Batalkan Pesanan</button>
                )}
            </div>

            <CancelOrderModal isOpen={cancelModal} onClose={() => setCancelModal(false)} onConfirm={confirmCancel} />
            <RateCustomerSheet isOpen={rateSheet} customerName={order.customerName} onClose={() => setRateSheet(false)} onSubmit={submitRating} />
            <ToastSnackbar message={toast} show={!!toast} />
        </div>
    );
};

   CHAT SCREEN — komunikasi mitra <-> pelanggan per pesanan
   ============================================================ */
const ChatScreen = ({ order, onBack }) => {
    const [messages, setMessages] = useState([
        { id: 1, from: 'customer', text: `Halo kak, ini untuk servis ${order?.itemName || 'barang saya'}. ${order?.issue || ''}`, time: '09:12' },
        { id: 2, from: 'me', text: 'Baik kak, ditunggu ya barangnya / saya segera meluncur ke lokasi.', time: '09:15' },
    ]);
    const [draft, setDraft] = useState('');
    const scRef = useRef(null);
    useEffect(() => { if (scRef.current && typeof scRef.current.scrollTo === 'function') scRef.current.scrollTo(0, scRef.current.scrollHeight); }, [messages]);

    const send = () => {
        if (!draft.trim()) return;
        setMessages(m => [...m, { id: Date.now(), from: 'me', text: draft, time: 'Baru saja' }]);
        setDraft('');
    };

    return (
        <div className="h-full w-full flex flex-col bg-[#F4F6F6]">
            <MTopBar onBack={onBack} title={order?.customerName || 'Chat'} />
            <div ref={scRef} className="flex-1 overflow-y-auto no-scrollbar px-4 py-4 flex flex-col gap-3">
                {messages.map(m => (
                    <div key={m.id} className={`flex ${m.from === 'me' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[75%] px-3.5 py-2.5 rounded-2xl text-[13px] leading-relaxed ${m.from === 'me' ? 'bg-primary-default text-white rounded-br-md' : 'bg-white text-[#14181A] rounded-bl-md border border-[#E8EBEA]'}`}>
                            {m.text}
                            <div className={`text-[9.5px] mt-1 ${m.from === 'me' ? 'text-white/70' : 'text-[#8D9699]'}`}>{m.time}</div>
                        </div>
                    </div>
                ))}
            </div>
            <div className="bg-white border-t border-[#E8EBEA] px-3 py-3 pb-safe flex items-center gap-2 shrink-0">
                <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="Tulis pesan..." className="flex-1 h-11 rounded-full bg-[#F4F6F6] px-4 text-[13px] outline-none" />
                <button onClick={send} className="w-11 h-11 rounded-full bg-primary-default flex items-center justify-center shrink-0 press-scale"><Icon.ArrowRight size={18} color="#fff" /></button>
            </div>
        </div>
    );
};

const TERMS_TEXT = [
    'Syarat & Ketentuan Mitra ini mengatur hubungan antara kamu (Mitra) dan platform Awetin dalam menyediakan jasa reparasi kepada pengguna.',
    'Awetin bertindak sebagai penghubung antara Mitra dan pengguna yang membutuhkan jasa reparasi. Awetin tidak mewajibkan setiap transaksi harus dilakukan lewat aplikasi — kunjungan lanjutan pelanggan secara langsung di luar aplikasi adalah bagian wajar dari hubungan kerja yang sehat.',

const PRIVACY_TEXT = [
    'Kebijakan Privasi ini menjelaskan bagaimana Awetin mengumpulkan dan menggunakan data pribadi Mitra, termasuk data KTP dan lokasi usaha, sesuai dengan Undang-Undang Perlindungan Data Pribadi (UU PDP).',
    'Data KTP digunakan semata-mata untuk keperluan verifikasi identitas Mitra dan tidak dibagikan ke pihak ketiga tanpa persetujuan, kecuali diwajibkan oleh hukum yang berlaku.',

const MitraAppShell = ({ onLogout }) => {
    const [tab, setTab] = useState('home');
    const [overlayStack, setOverlayStack] = useState([]);
    const [profile, setProfile] = useState(MITRA_PROFILE_INIT);
    const [isOpenStatus, setIsOpenStatus] = useState(true);
    const [orders, setOrders] = useState(ORDERS_INIT);
    const [transactions, setTransactions] = useState(TRANSACTIONS_INIT);
    const [warrantyClaims, setWarrantyClaims] = useState(WARRANTY_CLAIMS_INIT);
    const [notifItems, setNotifItems] = useState(NOTIF_ITEMS_INIT);
    const [toast, setToast] = useState('');
    const [isLoading, setIsLoading] = useState(true);
    const [demoOffline, setDemoOffline] = useState(false);
    const [logoutConfirm, setLogoutConfirm] = useState(false);
    const ratingRef = useRef(null);

    useEffect(() => { const t = setTimeout(() => setIsLoading(false), 1000); return () => clearTimeout(t); }, []);
    const triggerLoadingDemo = () => { setIsLoading(true); setTimeout(() => setIsLoading(false), 1400); };

    const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 2200); };

    const overlay = overlayStack[overlayStack.length - 1] || null;
    const push = (screen, data) => setOverlayStack(s => [...s, { screen, data }]);
    const closeOverlay = () => setOverlayStack(s => s.slice(0, -1));
    const closeAllOverlays = () => setOverlayStack([]);

    const pendingCount = orders.filter(o => o.status === 'baru').length;
    const unreadNotif = notifItems.filter(n => n.unread).length;
    const todaySummary = { earnings: 165600, completed: transactions.length > 0 ? 1 : 0 };

    const updateOrder = (id, patch) => setOrders(list => list.map(o => o.id === id ? { ...o, ...patch } : o));

    const handleToggleOpen = () => {
        if (demoOffline) { showToast('Perubahan akan tersimpan setelah koneksi kembali.'); setIsOpenStatus(s => !s); return; }
        setIsOpenStatus(s => !s);
    };

    const acceptOrder = (order) => {
        updateOrder(order.id, { status: order.type === 'besar' ? 'diterima' : 'menunggu_antar' });
        showToast('Pesanan diterima! Cek detail untuk mulai bekerja.');
        setTab('pesanan');
    };

    const [rejectTarget, setRejectTarget] = useState(null);
    const confirmReject = (reason) => {
        updateOrder(rejectTarget.id, { status: 'ditolak', rejectReason: reason, isFullyDone: true });
        setRejectTarget(null);
        showToast('Pesanan diteruskan ke tukang lain.');
    };

    const finishOrderToEarnings = (order) => {
        if (order.type === 'besar') {
            const gross = order.invoiceTotal || 150000;
            const commission = Math.round(gross * 0.08);
            setTransactions(tx => [{
                id: 'TX-' + Math.floor(100 + Math.random() * 900),
                customerName: order.customerName, itemName: order.itemName,
                date: 'Baru saja', grossAmount: gross, commissionPct: 8, commissionAmount: order.paymentMethod === 'cash' ? 0 : commission,
                netAmount: order.paymentMethod === 'cash' ? gross : gross - commission, tip: 0, isCash: order.paymentMethod === 'cash',
            }, ...tx]);
        }
        showToast('Pesanan selesai. Terima kasih! 🎉');
    };

    const markNotifRead = () => setNotifItems(items => items.map(n => ({ ...n, unread: false })));

    const handleProfileNav = (route) => {
        if (route === 'info_pencari_jasa') { push('info_pencari_jasa'); return; }
        push(route);
    };

    const openOrderFromNotif = (orderId) => {
        const order = orders.find(o => o.id === orderId);
        if (order) { setTab('pesanan'); push('order_detail', order); }
    };

    return (
        <div className="relative h-full w-full bg-background overflow-hidden">
            <div className="h-full w-full pb-[64px] overflow-hidden">
                {tab === 'home' && (
                    <HomeScreen
                        profile={profile} isOpenStatus={isOpenStatus} onToggleOpen={handleToggleOpen}
                        incomingOrders={orders.filter(o => o.status === 'baru')} todaySummary={todaySummary}
                        isLoading={isLoading} isOffline={demoOffline} onRetry={() => setDemoOffline(false)}
                        onGoPendapatan={() => setTab('pendapatan')}
                        onGoRatingProfil={() => { setTab('profil'); }}
                        onAccept={acceptOrder} onReject={(o) => setRejectTarget(o)}
                        onViewOrder={(o) => { setTab('pesanan'); push('order_detail', o); }}
                        unreadNotif={unreadNotif} onGoNotif={() => setTab('notifikasi')}
                    />
                )}
                {tab === 'pesanan' && (
                    <PesananMasukScreen orders={orders} isLoading={isLoading}
                        onAccept={acceptOrder} onReject={(o) => setRejectTarget(o)}
                        onViewOrder={(o) => push('order_detail', o)} />
                )}
                {tab === 'profil' && (
                    <ProfilUsahaScreen profile={profile} ratingRef={ratingRef} onNavigate={handleProfileNav} onLogout={() => setLogoutConfirm(true)} />
                )}
                {tab === 'pendapatan' && (
                    <PendapatanScreen transactions={transactions} warrantyClaims={warrantyClaims}
                        onScheduleClaim={(id, date, time) => setWarrantyClaims(list => list.map(c => c.id === id ? { ...c, status: 'terjadwal', scheduledDate: date, scheduledTime: time } : c))} />
                )}
                {tab === 'notifikasi' && (
                    <NotifikasiScreen items={notifItems} onOpenSettings={() => push('notif_settings')} onOpenOrder={openOrderFromNotif} />
                )}
            </div>

            <BottomNav active={tab} onChange={(id) => { setTab(id); if (id === 'notifikasi') markNotifRead(); closeAllOverlays(); }} pendingCount={pendingCount} unreadNotif={unreadNotif} />

            {overlayStack.map((ov, i) => {
                const isTop = i === overlayStack.length - 1;
                const style = isTop ? {} : { display: 'none' };
                const liveOrder = ov.screen === 'order_detail' ? (orders.find(o => o.id === ov.data?.id) || ov.data) : null;
                return (
                    <div key={i} className="absolute inset-0" style={style}>
                        {ov.screen === 'order_detail' && (
                            <OrderDetailScreen order={liveOrder} onBack={closeOverlay} onUpdateOrder={updateOrder}
                                onChatCustomer={() => push('chat', liveOrder)} onFinishOrder={finishOrderToEarnings} />
                        )}
                        {ov.screen === 'chat' && <ChatScreen order={ov.data} onBack={closeOverlay} />}
                        {ov.screen === 'edit_usaha' && <EditProfileUsahaScreen profile={profile} onBack={closeOverlay} onSave={(patch) => { setProfile(p => ({ ...p, ...patch })); closeOverlay(); showToast('Profil usaha diperbarui!'); }} />}
                        {ov.screen === 'portfolio' && <PortfolioManagerScreen portfolio={profile.portfolio} onBack={closeOverlay}
                            onAdd={() => { setProfile(p => ({ ...p, portfolio: [...p.portfolio, { id: 'p' + Date.now(), image: IMG.portfolio2, caption: 'Hasil pekerjaan baru' }] })); showToast('Foto ditambahkan!'); }}
                            onDelete={(id) => setProfile(p => ({ ...p, portfolio: p.portfolio.filter(x => x.id !== id) }))} />}
                        {ov.screen === 'keamanan' && <KeamananScreen onBack={closeOverlay} />}
                        {ov.screen === 'terms' && <StaticTextScreen title="Syarat & Ketentuan Mitra" paragraphs={TERMS_TEXT} onBack={closeOverlay} />}
                        {ov.screen === 'privacy' && <StaticTextScreen title="Kebijakan Privasi" paragraphs={PRIVACY_TEXT} onBack={closeOverlay} />}
                        {ov.screen === 'about' && <AboutScreen onBack={closeOverlay} demoOffline={demoOffline} onToggleDemoOffline={() => setDemoOffline(d => !d)} onTriggerLoadingDemo={triggerLoadingDemo} />}
                        {ov.screen === 'notif_settings' && <NotifPreferenceScreen onBack={closeOverlay} />}
                    </div>
                );
            })}

            <MitraInfoModal isOpen={overlay?.screen === 'info_pencari_jasa'} onClose={closeOverlay} />

            <RejectOrderSheet isOpen={!!rejectTarget} onClose={() => setRejectTarget(null)} onConfirm={confirmReject} />

            <ConfirmationModal
                isOpen={logoutConfirm}
                icon={Icon.LogOut} iconColor="#D42F2F" iconBg="bg-[#FCE7E7]"
                title="Keluar dari Akun?"
                message="Kamu perlu masuk lagi dengan nomor HP dan kode OTP untuk mengakses akun mitra ini."
                confirmLabel="Ya, Keluar" confirmVariant="destructive" cancelLabel="Batal"
                onConfirm={() => { setLogoutConfirm(false); onLogout(); }}
                onCancel={() => setLogoutConfirm(false)}
            />

            <ToastSnackbar message={toast} show={!!toast} />
        </div>
    );
};

/* ============================================================
   ROOT APP — Splash -> Interstitial -> Auth -> Onboarding Usaha -> Shell
   ============================================================ */
const App = () => {
    const [phase, setPhase] = useState('splash');
    const [phone, setPhone] = useState('');
    const [shellKey, setShellKey] = useState(0);

    useEffect(() => {
        if (phase === 'splash') {
            const t = setTimeout(() => setPhase('interstitial'), 1600);
            return () => clearTimeout(t);
        }
    }, [phase]);

    if (phase === 'splash') return <SplashScreen />;
    if (phase === 'interstitial') return <RoleInterstitialScreen onContinue={() => setPhase('phone')} />;
    if (phase === 'phone') return <PhoneEntryScreen onContinue={(p) => { setPhone(p); setPhase('otp'); }} onRecovery={() => setPhase('recovery')} />;
    if (phase === 'otp') return <OtpEntryScreen phone={phone} onBack={() => setPhase('phone')} onVerified={() => setPhase('onboarding_usaha')} />;
    if (phase === 'recovery') return <AccountRecoveryFlow onBack={() => setPhase('phone')} onDone={(newPhone) => { setPhone(newPhone); setPhase('onboarding_usaha'); }} />;
    if (phase === 'onboarding_usaha') return <OnboardingUsahaFlow onApproved={() => setPhase('main')} />;

    return <MitraAppShell key={shellKey} onLogout={() => { setShellKey(k => k + 1); setPhase('phone'); }} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
