const OBButton = ({ children, variant='primary', size='md', fullWidth=false, onClick, disabled=false, isLoading=false }) => {
    const base = "inline-flex items-center justify-center font-bold press-scale rounded-xl transition-colors disabled:opacity-60 disabled:pointer-events-none";
    const sizes = { hero: "h-[52px] px-6 text-[15px]", md: "h-12 px-6 text-[14px]", sm: "h-10 px-4 text-[13px]" };
    const variants = {
        primary: "bg-primary-default text-white shadow-elevation-1",
        secondary: "bg-white text-primary-default border border-border shadow-sm",
        tertiary: "bg-transparent text-primary-default",
        ghost: "bg-surface-variant text-text-secondary"
    };
    return (
        <button onClick={onClick} disabled={disabled||isLoading} className={`${base} ${sizes[size]} ${fullWidth?'w-full':'w-fit'} ${variants[variant]}`}>
            {isLoading ? <div className="w-5 h-5 border-2 border-current border-t-transparent rounded-full animate-spin"/> : children}
        </button>
    );
};

const OBNumericKeypad = ({ onDigit, onBackspace }) => {
    const rows = [
        [{n:'1',l:''},{n:'2',l:'ABC'},{n:'3',l:'DEF'}],
        [{n:'4',l:'GHI'},{n:'5',l:'JKL'},{n:'6',l:'MNO'}],
        [{n:'7',l:'PQRS'},{n:'8',l:'TUV'},{n:'9',l:'WXYZ'}],
    ];
    const Key = ({ n, l, onClick, children }) => (
        <button onClick={onClick} className="h-14 flex flex-col items-center justify-center rounded-xl bg-surface active:bg-surface-variant transition-colors shadow-[0_1px_2px_rgba(0,0,0,0.05)] border border-border">

    return (
        <div className="bg-background px-4 pt-3 pb-safe grid grid-cols-3 gap-2 shrink-0 border-t border-divider">
            {rows.flat().map(k => <Key key={k.n} n={k.n} l={k.l} onClick={()=>onDigit(k.n)}/>)}
            <div/>
            <Key n="0" onClick={()=>onDigit('0')}/>
            <Key onClick={onBackspace}><Icon.Delete size={24} color="#5C6668"/></Key>
        </div>
    );
};

const OBOtpEntryScreen = ({ onBack, phone, method, onVerified, onChangeMethod }) => {
    const [otp, setOtp] = useState('');
    const [timer, setTimer] = useState(45);
    const [verifying, setVerifying] = useState(false);

    useEffect(() => { if (timer<=0) return; const t = setTimeout(()=>setTimer(x=>x-1),1000); return ()=>clearTimeout(t); }, [timer]);

    const handleDigit = (d) => {
        if (otp.length >= 4 || verifying) return;
        const next = otp + d;
        setOtp(next);
        if (next.length === 4) { setVerifying(true); setTimeout(() => onVerified(), 650); }
    };

    return (
        <div className="flex flex-col h-full bg-surface pt-safe anim-page">
            <OBTopBar onBack={onBack}/>
            <div className="px-6 flex-1">
                <h1 className="t-h1 text-text-primary mb-2">Masukkan kode OTP</h1>
                <p className="t-body-l text-text-secondary mb-8">Kode 4 digit telah dikirim via {method==='wa'?'WhatsApp':'SMS'} ke +62 {phone}</p>

                <div className="flex justify-between gap-3 mb-8">
                    {[0,1,2,3].map(i => (
                        <div key={i} className={`flex-1 aspect-square rounded-xl border-2 flex items-center justify-center t-h1 transition-all ${otp[i] ? 'border-primary-default bg-primary-container/30 text-primary-default' : 'border-border bg-surface-variant text-transparent'}`}>
                            {otp[i] || '0'}
                        </div>
                    ))}
                </div>
                {verifying && <div className="flex justify-center mb-4"><div className="w-8 h-8 border-4 border-primary-default border-t-transparent rounded-full animate-spin"/></div>}

                <button onClick={onChangeMethod} className="t-label-l text-text-secondary underline">Coba metode lain</button>
            </div>
            <p className="t-body-m text-text-secondary text-center pb-4">
                {timer>0 ? <>Kirim ulang dalam <span className="font-mono font-semibold text-text-primary">00:{String(timer).padStart(2,'0')}</span></> : <button onClick={()=>setTimer(45)} className="text-primary-default font-semibold">Kirim ulang kode</button>}
            </p>
            <OBNumericKeypad onDigit={handleDigit} onBackspace={()=>setOtp(p=>p.slice(0,-1))}/>
        </div>
    );
};

const OBRecoveryFlow = ({ onBack, onDone }) => {
    const [step, setStep] = useState('old_phone');
    const [oldPhone, setOldPhone] = useState('');
    const [newPhone, setNewPhone] = useState('');

    if (step === 'old_phone') return (
        <div className="flex flex-col h-full bg-surface pt-safe anim-page">
            <OBTopBar onBack={onBack}/>
            <div className="px-6 flex-1">

                    <span className="t-label-l text-text-primary pr-3 border-r border-border mr-3">+62</span>
                    <span className={`t-h3 flex-1 ${oldPhone?'text-text-primary':'text-text-tertiary font-normal'}`}>{oldPhone || 'Nomor lama'}</span>
                </div>
            </div>
            <div className="px-6 pb-6 pt-2"><OBButton fullWidth size="hero" disabled={oldPhone.length<8} onClick={()=>setStep('new_phone')}>Kirim OTP ke Nomor Lama</OBButton></div>
            <OBNumericKeypad onDigit={(d)=>{ if(oldPhone.length<13) setOldPhone(p=>p+d); }} onBackspace={()=>setOldPhone(p=>p.slice(0,-1))}/>
        </div>
    );

    if (step === 'new_phone') return (
        <div className="flex flex-col h-full bg-surface pt-safe anim-page">
            <OBTopBar onBack={()=>setStep('old_phone')}/>
            <div className="px-6 flex-1">
                <h1 className="t-h1 text-text-primary mb-2">Nomor HP Baru</h1>
                <p className="t-body-l text-text-secondary mb-8">Akunmu akan dipindahkan ke nomor ini.</p>
                <div className="flex items-center bg-surface border border-border rounded-xl h-14 px-4 shadow-[0_1px_2px_rgba(0,0,0,0.05)]">
                    <span className="t-label-l text-text-primary pr-3 border-r border-border mr-3">+62</span>
                    <span className={`t-h3 flex-1 ${newPhone?'text-text-primary':'text-text-tertiary font-normal'}`}>{newPhone || 'Nomor baru'}</span>
                </div>
            </div>
            <div className="px-6 pb-6 pt-2"><OBButton fullWidth size="hero" disabled={newPhone.length<8} onClick={()=>setStep('done')}>Verifikasi & Pindah Akun</OBButton></div>
            <OBNumericKeypad onDigit={(d)=>{ if(newPhone.length<13) setNewPhone(p=>p+d); }} onBackspace={()=>setNewPhone(p=>p.slice(0,-1))}/>
        </div>
    );

    return (
        <div className="flex flex-col h-full bg-surface pt-safe items-center justify-center px-8 text-center anim-fade">
            <div className="w-20 h-20 rounded-full bg-success-container flex items-center justify-center mb-6"><Icon.Check size={36} color="#1E9E4A"/></div>
            <h2 className="t-h2 text-text-primary mb-2">Akun Berhasil Dipindah</h2>
            <p className="t-body-l text-text-secondary mb-10">Gunakan nomor barumu untuk masuk.</p>
            <div className="w-full"><OBButton fullWidth size="hero" onClick={onDone}>Masuk Sekarang</OBButton></div>
        </div>
    );
};

const OnboardingFlow = ({ onComplete }) => {
    const [step, setStep] = useState('welcome');
    const [mitraInfo, setMitraInfo] = useState(false);
    const [data, setData] = useState({ phone: '', method: 'wa', name: '', email: '' });

    useEffect(() => {
        if (step === 'transition') {
            const t = setTimeout(() => onComplete({ name: data.name || 'Budi' }), 1300);
            return () => clearTimeout(t);
        }
    }, [step]);

    if (step === 'welcome') return <OBWelcomeScreen onEnter={()=>setStep('interstitial')}/>;
    if (step === 'interstitial') return <><OBInterstitialRoleScreen onBack={()=>setStep('welcome')} onContinue={()=>setStep('phone')} onShowMitraInfo={()=>setMitraInfo(true)}/><OBMitraInfoSheet isOpen={mitraInfo} onClose={()=>setMitraInfo(false)}/></>;
    if (step === 'phone') return <OBPhoneEntryScreen onBack={()=>setStep('interstitial')} onRecovery={()=>setStep('recovery')} onContinue={(phone)=>{ setData(prev=>({...prev, phone})); setStep('otp_method'); }}/>;
    if (step === 'recovery') return <OBRecoveryFlow onBack={()=>setStep('phone')} onDone={()=>setStep('phone')}/>;
    if (step === 'otp_method') return <OBOtpMethodScreen onBack={()=>setStep('phone')} phone={data.phone} onSelect={(method)=>{ setData(p=>({...p, method})); setStep('otp_entry'); }}/>;

    if (step === 'otp_entry') return <OBOtpEntryScreen onBack={()=>setStep('otp_method')} phone={data.phone} method={data.method} onChangeMethod={()=>setStep('otp_method')} onVerified={()=>{
        // Logika Simulasi: 8111111111 = Akun Lama (langsung masuk), selain itu = Akun Baru (lengkapi profil)
        if(data.phone === '8111111111') setStep('transition');
        else setStep('name');
    }}/>;

    if (step === 'name') return <OBNameEntryScreen onContinue={(info)=>{ setData(p=>({...p, ...info})); setStep('email'); }}/>;
    if (step === 'email') return <OBEmailEntryScreen onContinue={(info)=>{ setData(p=>({...p, ...info})); setStep('location'); }}/>;
    if (step === 'location') return <OBLocationPermissionScreen onAllow={()=>setStep('welcome_offer')}/>;
    if (step === 'welcome_offer') return <OBWelcomeOfferScreen onContinue={()=>setStep('transition')}/>;

    if (step === 'transition') {
        return (
            <div className="flex flex-col h-full bg-surface items-center justify-center anim-fade">
                <div className="w-16 h-16 border-4 border-surface-variant border-t-primary-default rounded-full animate-spin mb-4"/>
                <p className="t-label-l text-text-secondary">Menyiapkan berandamu...</p>
            </div>
        );
    }
    return null;
};

// Button gaya "pill" dipakai konsisten di Home/Dampak/Category/Scan/Tukang/Profil
// (diambil dari desain yang berulang di file 6/7/8)
const MButton = ({ children, variant = 'primary', size = 'md', fullWidth = false, onClick, disabled = false, className = '' }) => {
    const base = "inline-flex items-center justify-center gap-2 font-bold transition-all duration-200 active:scale-[0.97] disabled:active:scale-100 disabled:opacity-60 disabled:cursor-not-allowed select-none rounded-full";
    const sizes = { hero: "h-[52px] px-6 text-[15px]", md: "h-12 px-6 text-[14px]", sm: "h-10 px-4 text-[13px]", xs: "h-8 px-3 text-[12px]" };
    const width = fullWidth ? "w-full" : "w-fit";
    const variants = {
        primary: "bg-[#00AA13] text-white shadow-[0_4px_12px_rgba(0,170,19,0.2)] hover:bg-[#049F16]",
        secondary: "bg-white text-[#14181A] border border-[#E8EBEA] shadow-sm hover:bg-[#F8FAFA]",
        outline: "bg-transparent text-[#00AA13] border border-[#00AA13] hover:bg-[#E3F7E4]",
        ghost: "bg-transparent text-[#5C6668] hover:bg-[#F8FAFA]",
        destructive: "bg-white text-[#D42F2F] border border-[#E8EBEA] shadow-sm hover:bg-[#FCE7E7]",
    };
    return (
        <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${width} ${variants[variant]} ${className}`}>
            {children}
        </button>
    );
};

// TopBar gaya konsisten dipakai di Dampak / Category / Scan-subscreen / Tukang detail / Profil / Chat
const MTopBar = ({ onBack, title, bg = "bg-white", text = "text-[#14181A]", border = true }) => (
    <div className={`h-14 flex items-center px-2 pt-safe shrink-0 relative z-10 ${bg} ${border ? 'border-b border-[#E8EBEA]' : ''}`}>
        {onBack && (
            <button onClick={onBack} className={`w-12 h-12 flex items-center justify-center ${text} active:bg-black/5 rounded-full transition-colors`}>
                <Icon.ArrowLeft size={24} />
            </button>
        )}
        {title && <h3 className={`text-[16px] font-extrabold ${text} absolute left-1/2 -translate-x-1/2 tracking-tight`}>{title}</h3>}
    </div>
);

const MBottomSheet = ({ isOpen, onClose, title, children }) => {
    if (!isOpen) return null;
    return (
        <div className="absolute inset-0 z-[100] flex flex-col justify-end">
            <div className="absolute inset-0 bg-[#14181A]/40 backdrop-blur-[2px] anim-fade" onClick={onClose} />
            <div className="bg-white rounded-t-[24px] relative z-10 anim-sheet-in flex flex-col max-h-[88%] shadow-[0_-8px_32px_rgba(0,0,0,0.12)]">
                <div className="flex justify-center pt-3 pb-2"><div className="w-12 h-1.5 bg-[#E8EBEA] rounded-full" /></div>

const WORKER_AUTO_REPLIES = [
    'Baik kak, ditunggu ya.',
    'Noted kak, kalau ada pertanyaan lain kabari saja.',
    'Siap kak.',
];

const CHAT_ACK_REPLIES = [
    'Baik kak, saya cek dulu ya. Sebentar saya kirimkan estimasi biayanya.',
    'Oke kak, noted keluhannya. Saya hitung dulu estimasinya sebentar.',
    'Siap kak, dari cerita kakak sepertinya saya sudah ada gambaran. Estimasi menyusul ya.',
];

const CHAT_POST_ACCEPT_REPLIES = [
    'Siap kak, saya otw ke lokasi sekarang!',
    'Baik, saya langsung berangkat ya kak.',
    'Oke kak, saya siapkan alatnya dan segera meluncur.',
];

const computeQuotePrice = (priceRange) => {
    const nums = (priceRange || '').match(/\d[\d.]*/g)?.map(s => parseInt(s.replace(/\./g, ''), 10)) || [30000, 100000];
    const lower = nums[0] || 30000;
    const upper = nums[1] || lower + 50000;
    const raw = lower + (upper - lower) * 0.35;
    return Math.round(raw / 5000) * 5000;
};

const ChatScreen = ({ worker, initialDraft = '', issue, onBack, onAcceptQuote }) => {
    const [msg, setMsg] = useState(initialDraft);
    const [messages, setMessages] = useState([
        { id: 'm0', from: 'worker', kind: 'text', text: `Halo kak! Ada yang bisa saya bantu untuk servis ${worker?.category?.toLowerCase() || 'barang'}nya?`, time: '10:45' },
    ]);
    const [typing, setTyping] = useState(false);
    const [quoteSent, setQuoteSent] = useState(false);
    const scrollRef = useRef(null);
    const seqRef = useRef(1);
    const nextId = () => `m${seqRef.current++}`;

    useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' }); }, [messages, typing]);

    const nowTime = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

    const handleSend = () => {
        const text = msg.trim();
        if (!text) return;
        const isFirstUserMsg = !quoteSent && !messages.some(m => m.from === 'me');
        setMessages(m => [...m, { id: nextId(), from: 'me', kind: 'text', text, time: nowTime() }]);
        setMsg('');
        setTyping(true);

        if (isFirstUserMsg) {
            setTimeout(() => {
                setTyping(false);
                const ack = CHAT_ACK_REPLIES[Math.floor(Math.random() * CHAT_ACK_REPLIES.length)];
                setMessages(m => [...m, { id: nextId(), from: 'worker', kind: 'text', text: ack, time: nowTime() }]);

                setTimeout(() => {
                    setTyping(true);
                    setTimeout(() => {
                        setTyping(false);
                        const price = computeQuotePrice(worker?.priceRange);
                        const desc = issue || (worker?.tags?.[0] ? `Servis ${worker.category} — ${worker.tags[0]}` : `Servis ${worker?.category || ''}`);
                        setMessages(m => [...m, { id: nextId(), from: 'worker', kind: 'quote', quote: { price, description: desc, status: 'pending' }, time: nowTime() }]);
                        setQuoteSent(true);
                    }, 1300);
                }, 900);
            }, 1100);
        } else {
            setTimeout(() => {
                setTyping(false);
                const reply = WORKER_AUTO_REPLIES[Math.floor(Math.random() * WORKER_AUTO_REPLIES.length)];
                setMessages(m => [...m, { id: nextId(), from: 'worker', kind: 'text', text: reply, time: nowTime() }]);
            }, 1100);
        }
    };

    const handleAcceptQuote = (msgId, quote) => {
        setMessages(m => m.map(mm => mm.id === msgId ? { ...mm, quote: { ...mm.quote, status: 'accepted' } } : mm));
        const order = onAcceptQuote({ worker, quote, issue: quote.description });
        setTimeout(() => {
            setTyping(true);
            setTimeout(() => {
                setTyping(false);
                const reply = CHAT_POST_ACCEPT_REPLIES[Math.floor(Math.random() * CHAT_POST_ACCEPT_REPLIES.length)];
                setMessages(m => [...m,
                    { id: nextId(), from: 'worker', kind: 'text', text: reply, time: nowTime() },
                    { id: nextId(), from: 'system', kind: 'system', text: `Pesanan ${order.id} berhasil dibuat` },
                ]);
            }, 1200);
        }, 300);
    };

    return (
        <div className="flex flex-col h-full bg-[#F4F6F6] absolute inset-0 z-[60] anim-page">
            <div className="h-16 flex items-center justify-between px-3 pt-safe bg-white border-b border-[#E8EBEA] shadow-sm shrink-0 z-10">
                <div className="flex items-center gap-2">
                    <button onClick={onBack} className="p-2 text-[#14181A] active:bg-[#F8FAFA] rounded-full transition-colors"><Icon.ArrowLeft size={24} /></button>
                    <div className="flex items-center gap-3">
                        <img src={worker?.photo || IMG.avatarMan1} className="w-10 h-10 rounded-full object-cover border border-[#E8EBEA]" alt="Avatar"/>
                        <div>
                            <h3 className="text-[15px] font-extrabold text-[#14181A] leading-tight tracking-tight">{worker?.name || 'Tukang'}</h3>
                            <p className="text-[12px] font-bold text-[#5C6668] flex items-center gap-1"><span className="w-1.5 h-1.5 bg-[#00AA13] rounded-full"></span>Online</p>
                        </div>
                    </div>
                </div>
                <a href={`https://wa.me/62812000000${(worker?.id || 't1').slice(1)}`} target="_blank" rel="noreferrer" className="p-2 text-[#00AA13] active:bg-[#E3F7E4] rounded-full transition-colors"><Icon.Phone size={24} /></a>
            </div>

            <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 flex flex-col gap-3 no-scrollbar">
                <div className="text-center mb-1"><span className="bg-[#E8EBEA] text-[#5C6668] text-[10px] font-extrabold px-3 py-1.5 rounded-full tracking-widest uppercase">HARI INI</span></div>
                {messages.map((m) => {
                    if (m.kind === 'system') return (
                        <div key={m.id} className="flex justify-center my-1 anim-fade">
                            <span className="inline-flex items-center gap-1.5 bg-primary-container text-[#046B0C] text-[11px] font-extrabold px-3 py-1.5 rounded-full">
                                <Icon.CheckCircle size={13} /> {m.text}
                            </span>
                        </div>
                    );
                    if (m.kind === 'quote') return (
                        <div key={m.id} className="flex items-end gap-2 max-w-[85%] self-start anim-fade">
                            <img src={worker?.photo || IMG.avatarMan1} className="w-8 h-8 rounded-full object-cover shrink-0 mb-1 border border-[#E8EBEA]" alt="Avatar"/>
                            <div className="bg-white border-2 border-primary-default/25 shadow-sm rounded-2xl rounded-bl-none p-4 w-[250px]">
                                <div className="flex items-center gap-1.5 mb-2">
                                    <Icon.Package size={14} color="#00AA13" />
                                    <span className="text-[10px] font-extrabold text-[#00AA13] uppercase tracking-wide">Estimasi Biaya Servis</span>
                                </div>
                                <p className="text-[13px] font-bold text-[#14181A] mb-1 leading-snug">{m.quote.description}</p>
                                <p className="text-[21px] font-extrabold text-[#14181A] mb-3">Rp{m.quote.price.toLocaleString('id-ID')}</p>
                                {m.quote.status === 'accepted' ? (
                                    <div className="flex items-center gap-1.5 bg-primary-container rounded-lg px-3 py-2">
                                        <Icon.CheckCircle size={14} color="#046B0C" />

                                )}
                                <span className="text-[10px] font-bold text-[#8D9699] block text-right mt-2">{m.time}</span>
                            </div>
                        </div>
                    );
                    return m.from === 'worker' ? (
                    <div key={m.id} className="flex items-end gap-2 max-w-[85%] self-start anim-fade">
                        <img src={worker?.photo || IMG.avatarMan1} className="w-8 h-8 rounded-full object-cover shrink-0 mb-1 border border-[#E8EBEA]" alt="Avatar"/>
                        <div className="bg-white border border-[#E8EBEA] shadow-sm p-4 rounded-2xl rounded-bl-none">
                            <p className="text-[14px] font-bold text-[#14181A] leading-relaxed whitespace-pre-line">{m.text}</p>
                            <span className="text-[10px] font-bold text-[#8D9699] block text-right mt-2">{m.time}</span>
                        </div>
                    </div>
                ) : (
                    <div key={m.id} className="flex items-end gap-2 max-w-[85%] self-end anim-fade">
                        <div className="bg-primary-default p-4 rounded-2xl rounded-br-none shadow-sm">
                            <p className="text-[14px] font-bold text-white leading-relaxed whitespace-pre-line">{m.text}</p>
                            <span className="text-[10px] font-bold text-white/70 block text-right mt-2">{m.time}</span>
                        </div>
                    </div>
                );
                })}
                {typing && (
                    <div className="flex items-end gap-2 max-w-[85%] self-start anim-fade">
                        <img src={worker?.photo || IMG.avatarMan1} className="w-8 h-8 rounded-full object-cover shrink-0 mb-1 border border-[#E8EBEA]" alt="Avatar"/>
                        <div className="bg-white border border-[#E8EBEA] shadow-sm px-4 py-3.5 rounded-2xl rounded-bl-none flex gap-1 items-center">
                            <span className="w-1.5 h-1.5 bg-[#B7BEBC] rounded-full animate-bounce" style={{ animationDelay: '0ms' }} />
                            <span className="w-1.5 h-1.5 bg-[#B7BEBC] rounded-full animate-bounce" style={{ animationDelay: '150ms' }} />
                            <span className="w-1.5 h-1.5 bg-[#B7BEBC] rounded-full animate-bounce" style={{ animationDelay: '300ms' }} />
                        </div>
                    </div>
                )}
            </div>

            <div className="bg-white border-t border-[#E8EBEA] p-3 pb-safe shrink-0 flex items-end gap-2 shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">
                <button className="w-10 h-10 flex items-center justify-center text-[#5C6668] bg-[#F4F6F6] rounded-full shrink-0 active:bg-[#E8EBEA] transition-colors"><Icon.Camera size={20} /></button>
                <div className="flex-1 bg-[#F4F6F6] border border-transparent focus-within:border-[#00AA13] focus-within:bg-white rounded-[20px] px-4 py-2 flex items-center transition-colors">
                    <textarea
                        value={msg} onChange={e => setMsg(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}

const BookingSheet = ({ isOpen, worker, onClose, onConfirm }) => {
    const [keluhan, setKeluhan] = useState('');
    const [jadwal, setJadwal] = useState('Sekarang');
    const [phase, setPhase] = useState('form');

    useEffect(() => { if (isOpen) { setPhase('form'); setKeluhan(''); setJadwal('Sekarang'); } }, [isOpen]);

    if (!isOpen || !worker) return null;

    const handleConfirm = () => {
        setPhase('loading');
        setTimeout(() => {
            setPhase('success');
            setTimeout(() => {
                onConfirm({ worker, keluhan: keluhan.trim() || `Servis ${worker.category.toLowerCase()} — ${worker.tags[0]}`, jadwal });
            }, 1100);
        }, 700);
    };

    return (
        <MBottomSheet isOpen={isOpen} onClose={phase === 'form' ? onClose : undefined} title={phase === 'form' ? 'Booking Tukang' : undefined}>
            {phase === 'form' && (
                <div className="flex flex-col gap-5 pb-2">
                    <div className="flex items-center gap-3 bg-[#F8FAFA] border border-[#E8EBEA] rounded-xl p-3">
                        <img src={worker.photo} className="w-12 h-12 rounded-full object-cover border border-[#E8EBEA]" alt={worker.name} />
                        <div className="flex-1 min-w-0">
                            <p className="text-[14px] font-extrabold text-[#14181A] truncate">{worker.name}</p>
                            <p className="text-[12px] text-[#5C6668]">{worker.category} · {worker.priceRange}</p>
                        </div>
                    </div>
                    <div>
                        <label className="text-[12px] font-extrabold text-[#5C6668] uppercase tracking-wide block mb-2">Jadwal</label>
                        <div className="flex gap-2">
                            {['Sekarang', 'Sore ini', 'Besok pagi'].map(j => (
                                <button key={j} onClick={() => setJadwal(j)} className={`flex-1 h-10 rounded-full text-[13px] font-bold border transition-colors ${jadwal === j ? 'bg-primary-container text-[#046B0C] border-primary-default' : 'bg-white text-[#5C6668] border-[#E8EBEA]'}`}>{j}</button>
                            ))}
                        </div>
                    </div>
                    <div>
                        <label className="text-[12px] font-extrabold text-[#5C6668] uppercase tracking-wide block mb-2">Ceritakan keluhanmu (opsional)</label>
                        <textarea value={keluhan} onChange={e => setKeluhan(e.target.value)} placeholder={`Contoh: ${worker.tags[0]} bermasalah, mohon dicek`} rows={3} className="w-full bg-[#F8FAFA] border border-[#E8EBEA] rounded-xl p-3 text-[14px] text-[#14181A] outline-none focus:border-primary-default focus:bg-white transition-colors resize-none" />
                    </div>
                    <MButton fullWidth size="hero" onClick={handleConfirm}>Konfirmasi Pesanan</MButton>
                </div>
            )}
            {phase === 'loading' && (
                <div className="flex flex-col items-center justify-center py-10">
                    <div className="w-12 h-12 border-4 border-primary-container border-t-primary-default rounded-full animate-spin mb-4" />
                    <p className="text-[14px] font-bold text-[#5C6668]">Mengirim pesanan ke {worker.name}...</p>
                </div>
            )}
            {phase === 'success' && (
                <div className="flex flex-col items-center justify-center py-10 anim-fade-scale">
                    <div className="w-16 h-16 rounded-full bg-success-container flex items-center justify-center mb-4"><Icon.Check size={32} color="#1E9E4A" /></div>
                    <p className="text-[16px] font-extrabold text-[#14181A] mb-1">Pesanan berhasil dibuat!</p>
                    <p className="text-[13px] text-[#5C6668] text-center">Mengarahkan ke halaman Pesanan...</p>
                </div>
            )}
        </MBottomSheet>
    );
};

const OrderDetailScreen = ({ order, onBack, onChatWorker, onReorder, onCompleteOrder }) => {
    const [reviewOpen, setReviewOpen] = useState(false);
    const [reviewRating, setReviewRating] = useState(5);
    const [reviewText, setReviewText] = useState('');
    const [reviewSent, setReviewSent] = useState(false);
    const [completeConfirmOpen, setCompleteConfirmOpen] = useState(false);
    if (!order) return null;

    const steps = order.status === 'Dibatalkan'
        ? [{ label: 'Pesanan dibuat', done: true }, { label: 'Dibatalkan', done: true, danger: true }]
        : [
            { label: 'Pesanan dikonfirmasi', done: true },
            { label: 'Tukang menuju lokasi / mengerjakan', done: order.status === 'Selesai' || order.statusLabel === 'Sedang Dikerjakan' },
            { label: 'Selesai', done: order.status === 'Selesai' },
        ];

    return (
        <div className="absolute inset-0 z-50 bg-white flex flex-col anim-page">
            <MTopBar onBack={onBack} title={order.id} />
            <div className="flex-1 overflow-y-auto no-scrollbar pb-28">
                <div className="px-5 py-4 border-b border-[#E8EBEA] flex items-center justify-between">
                    <div>
                        <p className="text-[12px] text-[#8D9699] font-bold">{order.category} · {order.date}</p>
                        <h2 className="text-[16px] font-extrabold text-[#14181A] mt-0.5">{order.issue}</h2>
                    </div>
                    <span className={`text-[11px] font-extrabold px-2.5 py-1 rounded-md border tracking-wide uppercase shrink-0 ${
                        order.status === 'Selesai' ? 'bg-[#E3F7E4] text-[#00AA13] border-[#00AA13]/20' :
                        order.status === 'Proses' ? 'bg-[#FFF1D6] text-[#F6A609] border-[#F6A609]/20' :
                        'bg-[#FCE7E7] text-[#D42F2F] border-[#D42F2F]/20'
                    }`}>{order.statusLabel}</span>
                </div>

                <div className="px-5 py-5 border-b border-[#E8EBEA]">
                    <h3 className="text-[13px] font-extrabold text-[#5C6668] uppercase tracking-wide mb-4">Status Pesanan</h3>
                    <div className="flex flex-col">
                        {steps.map((s, i) => (
                            <div key={i} className="flex gap-3">
                                <div className="flex flex-col items-center">
                                    <div className={`w-3 h-3 rounded-full shrink-0 ${s.done ? (s.danger ? 'bg-error-default' : 'bg-primary-default') : 'bg-[#DDE2E1]'}`} />
                                    {i !== steps.length - 1 && <div className={`w-0.5 flex-1 min-h-[28px] ${s.done ? 'bg-primary-default' : 'bg-[#DDE2E1]'}`} />}
                                </div>
                                <p className={`text-[14px] pb-6 -mt-0.5 ${s.done ? 'text-[#14181A] font-bold' : 'text-[#8D9699]'}`}>{s.label}</p>
                            </div>
                        ))}
                    </div>
                </div>

                <div className="px-5 py-5 border-b border-[#E8EBEA]">
                    <h3 className="text-[13px] font-extrabold text-[#5C6668] uppercase tracking-wide mb-3">Tukang</h3>
                    <div className="flex items-center gap-3">
                        <img src={order.photo} className="w-12 h-12 rounded-full object-cover border border-[#E8EBEA]" alt={order.name} />
                        <div className="flex-1 min-w-0">
                            <p className="text-[14px] font-extrabold text-[#14181A]">{order.name}</p>
                            <p className="text-[12px] text-[#5C6668]">{order.category}</p>
                        </div>
                        {order.status !== 'Dibatalkan' && (
                            <button onClick={() => onChatWorker(order)} className="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center active:scale-90 transition-transform">
                                <Icon.MessageSquare size={18} color="#046B0C" />
                            </button>
                        )}
                    </div>
                </div>

                <div className="px-5 py-5">
                    <h3 className="text-[13px] font-extrabold text-[#5C6668] uppercase tracking-wide mb-3">Rincian Biaya</h3>
                    <div className="flex justify-between items-center">
                        <span className="text-[14px] text-[#5C6668]">Total {order.status === 'Selesai' ? 'Pembayaran' : 'Estimasi'}</span>
                        <span className="text-[16px] font-extrabold text-[#14181A]">{order.price}</span>
                    </div>
                </div>

                {order.status === 'Selesai' && reviewSent && (
                    <div className="mx-5 mb-5 p-4 bg-primary-container rounded-xl flex items-center gap-3">
                        <Icon.CheckCircle size={20} color="#046B0C" />
                        <p className="text-[13px] font-bold text-[#046B0C]">Terima kasih atas ulasanmu!</p>
                    </div>
                )}
            </div>

            <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-[#E8EBEA] p-4 pb-safe flex flex-col gap-2.5 shadow-[0_-4px_16px_rgba(0,0,0,0.04)]">
                {order.status === 'Selesai' ? (
                    <div className="flex gap-3">
                        <MButton variant="secondary" fullWidth onClick={() => setReviewOpen(true)} disabled={reviewSent}>{reviewSent ? 'Sudah Diulas' : 'Beri Ulasan'}</MButton>
                        <MButton variant="primary" fullWidth onClick={() => onReorder(order)}>Pesan Lagi</MButton>
                    </div>
                ) : order.status === 'Dibatalkan' ? (
                    <MButton variant="primary" fullWidth onClick={() => onReorder(order)}>Pesan Lagi</MButton>
                ) : (
                    <>
                        <MButton variant="primary" fullWidth onClick={() => onChatWorker(order)}>Hubungi Tukang</MButton>
                        <button onClick={() => setCompleteConfirmOpen(true)} className="text-[13px] font-bold text-[#00AA13] text-center py-1">Tandai Pekerjaan Selesai</button>
                    </>
                )}
            </div>

            <MBottomSheet isOpen={completeConfirmOpen} onClose={() => setCompleteConfirmOpen(false)} title="Konfirmasi Selesai">
                <div className="flex flex-col gap-4 pb-2">
                    <div className="w-14 h-14 rounded-full bg-primary-container flex items-center justify-center mx-auto"><Icon.CheckCircle size={28} color="#046B0C" /></div>
                    <p className="text-[14px] text-[#5C6668] text-center leading-relaxed">Pastikan pekerjaan dari <strong className="text-[#14181A]">{order.name}</strong> sudah selesai dikerjakan dengan baik sebelum menandainya selesai.</p>
                    <div className="flex gap-3">
                        <MButton variant="secondary" fullWidth onClick={() => setCompleteConfirmOpen(false)}>Belum</MButton>
                        <MButton variant="primary" fullWidth onClick={() => { setCompleteConfirmOpen(false); onCompleteOrder(order); }}>Ya, Sudah Selesai</MButton>
                    </div>
                </div>
            </MBottomSheet>

            <MBottomSheet isOpen={reviewOpen} onClose={() => setReviewOpen(false)} title="Beri Ulasan">
                <div className="flex flex-col gap-4 pb-2">
                    <p className="text-[13px] text-[#5C6668] text-center -mt-1">Bagaimana pengalamanmu dengan {order.name}?</p>
                    <div className="flex justify-center gap-1.5 py-2">
                        {[1,2,3,4,5].map(i => (
                            <button key={i} onClick={() => setReviewRating(i)} className="active:scale-90 transition-transform">
                                <Icon.Star size={32} filled={i <= reviewRating} color={i <= reviewRating ? '#F6A609' : '#DDE2E1'} />
                            </button>
                        ))}
                    </div>
                    <textarea value={reviewText} onChange={e => setReviewText(e.target.value)} placeholder="Ceritakan pengalamanmu (opsional)" rows={3} className="w-full bg-[#F8FAFA] border border-[#E8EBEA] rounded-xl p-3 text-[14px] outline-none focus:border-primary-default focus:bg-white transition-colors resize-none" />
                    <MButton fullWidth size="hero" onClick={() => { setReviewOpen(false); setReviewSent(true); }}>Kirim Ulasan</MButton>
                </div>
            </MBottomSheet>
        </div>
    );
};

const JUALBELI_CATEGORIES = ['Elektronik', 'Pakaian', 'Sepatu', 'Lainnya'];
const JUALBELI_CONDITIONS = ['Baru', 'Baik', 'Perlu Perbaikan Kecil'];
const JUALBELI_STOCK_PHOTOS = [IMG.washer, IMG.solderWire, IMG.fridge, IMG.tailorShop];

            id: 'ls' + Date.now(),

            price: gratis ? 'Donasi Gratis' : (harga ? `Rp${harga}` : 'Nego'),

                        <><Icon.CheckCircle size={24} color="#00AA13" /><span className="text-[12px] font-bold text-[#046B0C] mt-2">1 foto ditambahkan</span></>
                    ) : (
                        <><Icon.Camera size={24} color="#8D9699" /><span className="text-[12px] font-bold text-[#8D9699] mt-2">+ Tambah Foto Barang</span></>
                    )}
                </button>

                <label className="text-[12px] font-extrabold text-[#5C6668] uppercase tracking-wide block mb-2">Nama Barang</label>
                <input value={nama} onChange={e => setNama(e.target.value)} placeholder="Contoh: Kipas Angin Berdiri" className="w-full h-12 bg-[#F8FAFA] border border-[#E8EBEA] rounded-xl px-4 text-[14px] outline-none focus:border-primary-default focus:bg-white transition-colors mb-5" />

                <div className="flex flex-wrap gap-2 mb-5">
                    {JUALBELI_CATEGORIES.map(c => (
                        <button key={c} onClick={() => setKategori(c)} className={`h-9 px-4 rounded-full text-[13px] font-bold border transition-colors ${kategori === c ? 'bg-primary-container text-[#046B0C] border-primary-default' : 'bg-white text-[#5C6668] border-[#E8EBEA]'}`}>{c}</button>
                    ))}
                </div>

                <label className="text-[12px] font-extrabold text-[#5C6668] uppercase tracking-wide block mb-2">Kondisi</label>
                <div className="flex flex-wrap gap-2 mb-5">
                    {JUALBELI_CONDITIONS.map(c => (
                        <button key={c} onClick={() => setKondisi(c)} className={`h-9 px-4 rounded-full text-[13px] font-bold border transition-colors ${kondisi === c ? 'bg-primary-container text-[#046B0C] border-primary-default' : 'bg-white text-[#5C6668] border-[#E8EBEA]'}`}>{c}</button>
                    ))}
                </div>

                <div className="flex items-center justify-between mb-3">
                    <label className="text-[12px] font-extrabold text-[#5C6668] uppercase tracking-wide">Donasikan gratis</label>
                    <Toggle checked={gratis} onChange={setGratis} />

                {!gratis && (
                    <div className="flex items-center bg-[#F8FAFA] border border-[#E8EBEA] rounded-xl h-12 px-4 mb-5 focus-within:border-primary-default focus-within:bg-white transition-colors">
                        <span className="text-[14px] font-bold text-[#5C6668] mr-2">Rp</span>

                )}

                <label className="text-[12px] font-extrabold text-[#5C6668] uppercase tracking-wide block mb-2">Deskripsi</label>
                <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={3} placeholder="Ceritakan kondisi barang lebih detail..." className="w-full bg-[#F8FAFA] border border-[#E8EBEA] rounded-xl p-3 text-[14px] outline-none focus:border-primary-default focus:bg-white transition-colors resize-none mb-6" />

                <MButton fullWidth size="hero" disabled={!valid} onClick={handleSubmit}>Unggah Barang</MButton>
            </div>
        </div>
    );
};

/* ============================================================
   PENGHUBUNG UTAMA (App Shell) — menyatukan semua bagian di atas
   dengan SATU Bottom Navigation acuan (dari Home / file ke-2)
   ============================================================ */

const FallbackScreen = ({ label, onBack }) => (
    <div className="absolute inset-0 z-50 bg-white flex flex-col anim-page">
        <MTopBar onBack={onBack} title={label || 'Halaman'} />
        <div className="flex-1 flex flex-col items-center justify-center text-center px-8">

            <MButton className="mt-6" onClick={onBack}>Kembali</MButton>
        </div>
    </div>
);

let orderSeq = 4;

const INITIAL_IMPACT_COUNTS = { Elektronik: 60, Pakaian: 40, Sepatu: 25, Las: 17 };

const AppShell = ({ userName, onLogout }) => {
    const [tab, setTab] = useState('home');
    const [overlayStack, setOverlayStack] = useState([]);
    const [orders, setOrders] = useState(DATA_PESANAN);
    const [favoriteIds, setFavoriteIds] = useState(FAVORIT_IDS);
    const [listings, setListings] = useState(LISTING_ITEMS_INIT);
    const [addresses, setAddresses] = useState(ADDRESS_LIST_INIT);
    const [profileName, setProfileName] = useState(userName);
    const [toast, setToast] = useState('');
    const [notifItems, setNotifItems] = useState(NOTIF_ITEMS);
    const [impactCounts, setImpactCounts] = useState(INITIAL_IMPACT_COUNTS);
    const [personalContribution, setPersonalContribution] = useState(2);
    const [hasBookedBefore, setHasBookedBefore] = useState(false);

    const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 2200); };

    const overlay = overlayStack[overlayStack.length - 1] || null;
    const push = (screen, data) => setOverlayStack(s => [...s, { screen, data }]);
    const closeOverlay = () => setOverlayStack(s => s.slice(0, -1));
    const closeAllOverlays = () => setOverlayStack([]);
    const replaceTop = (screen, data) => setOverlayStack(s => [...s.slice(0, -1), { screen, data }]);

    const totalImpact = Object.values(impactCounts).reduce((a, b) => a + b, 0);
    const unreadCount = notifItems.filter(n => n.unread).length;

    const toggleFavorite = (workerId) => {
        setFavoriteIds(ids => ids.includes(workerId) ? ids.filter(id => id !== workerId) : [...ids, workerId]);
    };

    const addImpact = (category, amount = 1) => {
        setImpactCounts(c => ({ ...c, [category]: (c[category] || 0) + amount }));
        setPersonalContribution(p => p + amount);
    };

    const markNotificationsRead = () => {
        setNotifItems(items => items.map(n => ({ ...n, unread: false })));
    };

    const addOrderFromBooking = ({ worker, keluhan, jadwal }) => {
        const newOrder = {
            id: 'ORD-' + String(++orderSeq).padStart(3, '0'),
            name: worker.name,
            category: worker.category,
            issue: keluhan,
            status: 'Proses',
            statusLabel: 'Dikonfirmasi',
            date: jadwal === 'Sekarang' ? 'Hari ini, baru saja' : jadwal,
            price: 'Estimasi ' + worker.priceRange.split(' - ')[0],
            photo: worker.photo,
        };
        setOrders(o => [newOrder, ...o]);
        setHasBookedBefore(true);
        closeAllOverlays();
        setTab('pesanan');
        showToast('Pesanan berhasil dibuat!');
        return newOrder;
    };

    const addOrderFromChat = ({ worker, quote, issue }) => {
        const newOrder = {
            id: 'ORD-' + String(++orderSeq).padStart(3, '0'),
            name: worker.name,
            category: worker.category,
            issue: issue || `Servis ${worker.category}`,
            status: 'Proses',
            statusLabel: 'Dikonfirmasi',
            date: 'Hari ini, baru saja',
            price: `Rp${quote.price.toLocaleString('id-ID')} (Disepakati)`,
            photo: worker.photo,
        };
        setOrders(o => [newOrder, ...o]);
        setHasBookedBefore(true);
        showToast(`Pesanan ${newOrder.id} dibuat dari chat! Cek tab Pesanan.`);
        return newOrder;
    };

    const completeOrder = (order) => {
        setOrders(list => list.map(o => o.id === order.id
            ? { ...o, status: 'Selesai', statusLabel: 'Selesai', price: o.price.replace('Estimasi ', '') }
            : o));
        addImpact(order.category);
        showToast('Pekerjaan ditandai selesai. Terima kasih! 🎉');
    };

    const logSelfService = (worker) => {
        addImpact(worker.category);
    };

    const handleReorder = (order) => {
        const worker = TUKANG_LIST.find(w => w.name === order.name) || TUKANG_LIST[0];
        replaceTop('booking', worker);
    };

    const handleHomeNavigate = (route, data) => {
        if (route === 'dampak') return push('dampak');
        if (route === 'category' || route === 'scan_category') return push('category', data);
        if (route === 'scan') return push('ai_scan');
        if (route === 'article') return push('article', data);
        if (route === 'search') return push('search');
        if (route === 'notifications') { markNotificationsRead(); return push('notifications'); }
        if (route === 'worker_detail') return push('worker_detail', { worker: data });
        if (route === 'all_favorites') return push('all_favorites');
        if (route === 'goto_tukang_tab') { setTab('tukang'); return closeAllOverlays(); }
        if (route === 'goto_pesanan_tab') { setTab('pesanan'); return closeAllOverlays(); }
        return push('fallback', route);
    };

    const handleProfileNavigate = (route, data) => {
        if (['keamanan', 'alamat', 'notif_pref', 'edit_profile', 'help_center', 'about'].includes(route)) return push(route);
        return push('fallback', data || route);
    };

    return (
        <div className="relative h-full w-full bg-background overflow-hidden">
            <div className="h-full w-full pb-[64px] overflow-hidden">
                {tab === 'home' && <HomeScreen userName={profileName} onNavigate={handleHomeNavigate} unreadCount={unreadCount} totalImpact={totalImpact} hasBookedBefore={hasBookedBefore} />}
                {tab === 'pesanan' && <PesananScreen orders={orders} onViewDetail={(o) => push('order_detail', o)} onReorder={handleReorder} onGoHome={() => setTab('home')} />}
                {tab === 'tukang' && <TukangDirectoryScreen
                    isGuest={false}
                    favoriteIds={favoriteIds}
                    onToggleFavorite={toggleFavorite}
                    listings={listings}
                    onSelectWorker={(w) => push('worker_detail', { worker: w })}
                    onOpenJualBeli={() => push('jual_beli_form')}
                    onOpenListing={(l) => push('listing_detail', l)}
                    onBookWorker={(w) => push('booking', w)}
                    onLogSelfService={logSelfService}
                />}
                {tab === 'profil' && <ProfilTab userName={profileName} onLogout={onLogout} onNavigate={handleProfileNavigate} />}
            </div>

            <BottomNav active={tab} onChange={(id) => {
                if (id === 'perbaiki') push('ai_scan');
                else { setTab(id); closeAllOverlays(); }
            }} />

            {/* ===== Overlay layer (di atas Bottom Nav), ditumpuk agar navigasi "kembali" alami ===== */}
            {overlayStack.map((ov, i) => {
                const isTop = i === overlayStack.length - 1;
                const style = isTop ? {} : { display: 'none' };
                const liveOrder = ov.screen === 'order_detail' ? (orders.find(o => o.id === ov.data?.id) || ov.data) : null;
                return (
                    <div key={i} style={style}>
                        {ov.screen === 'dampak' && <DampakDashboardScreen onBack={closeOverlay} impactCounts={impactCounts} personalContribution={personalContribution} />}

                        {ov.screen === 'category' && <CategoryScreen category={ov.data} onBack={closeOverlay}
                            onSelectWorker={(w) => push('worker_detail', { worker: w })} />}

                        {ov.screen === 'ai_scan' && <ScanAIScreen onBack={closeOverlay} onNavigate={(r, d) => push(r, d)} />}

                        {ov.screen === 'service_flow_kecil' && <ServiceFlowKecilScreen data={ov.data} onBack={closeOverlay} onNavigate={(r, d) => push(r, d)} />}

                        {ov.screen === 'chat' && <ChatScreen worker={ov.data?.worker} initialDraft={ov.data?.draft} issue={ov.data?.issue} onBack={closeOverlay} onAcceptQuote={addOrderFromChat} />}

                        {ov.screen === 'article' && <ArticleReader articleId={ov.data} onBack={closeOverlay} onOpenArticle={(id) => replaceTop('article', id)} />}

                        {ov.screen === 'search' && <SearchScreen onBack={closeOverlay} onSelectWorker={(w) => push('worker_detail', { worker: w })} />}

                        {ov.screen === 'worker_detail' && <WorkerDetailScreen worker={ov.data?.worker} aiIssue={ov.data?.issue} onBack={closeOverlay}
                            isFavorite={favoriteIds.includes(ov.data?.worker?.id)} onToggleFavorite={toggleFavorite}
                            onChat={() => push('chat', { worker: ov.data?.worker, draft: ov.data?.aiDraft, issue: ov.data?.issue })}
                            onOpenBooking={() => push('booking', ov.data?.worker)} />}

                        {ov.screen === 'booking' && <BookingSheet isOpen={true} worker={ov.data} onClose={closeOverlay} onConfirm={addOrderFromBooking} />}

                        {ov.screen === 'notifications' && <NotificationsScreen items={notifItems} onBack={closeOverlay} />}

                        {ov.screen === 'all_favorites' && <AllFavoritesScreen favoriteIds={favoriteIds} onBack={closeOverlay} onSelectWorker={(w) => push('worker_detail', { worker: w })} />}

                        {ov.screen === 'order_detail' && <OrderDetailScreen order={liveOrder} onBack={closeOverlay}
                            onChatWorker={(order) => { const w = TUKANG_LIST.find(x => x.name === order.name); push('chat', { worker: w || TUKANG_LIST[0] }); }}
                            onReorder={handleReorder}
                            onCompleteOrder={completeOrder} />}

                        {ov.screen === 'jual_beli_form' && <JualBeliFormScreen onBack={closeOverlay} onSubmit={(listing) => { setListings(l => [listing, ...l]); closeOverlay(); showToast('Barang berhasil diunggah!'); }} />}

                        {ov.screen === 'listing_detail' && <ListingDetailScreen listing={ov.data} onBack={closeOverlay}
                            onDelete={(id) => { setListings(l => l.filter(x => x.id !== id)); closeOverlay(); showToast('Listing dihapus.'); }} />}

                        {ov.screen === 'keamanan' && <KeamananScreen onBack={closeOverlay} />}

                        {ov.screen === 'alamat' && <AlamatScreen addresses={addresses} onBack={closeOverlay}
                            onAdd={(a) => setAddresses(list => [...list, a])}
                            onSetPrimary={(id) => setAddresses(list => list.map(a => ({ ...a, isPrimary: a.id === id })))}
                            onDelete={(id) => setAddresses(list => list.filter(a => a.id !== id))} />}

                        {ov.screen === 'notif_pref' && <NotifPreferenceScreen onBack={closeOverlay} />}

                        {ov.screen === 'edit_profile' && <EditProfileScreen userName={profileName} onBack={closeOverlay}
                            onSave={(name) => { setProfileName(name); closeOverlay(); showToast('Profil diperbarui!'); }} />}

                        {ov.screen === 'help_center' && <HelpCenterScreen onBack={closeOverlay} />}

                        {ov.screen === 'about' && <AboutScreen onBack={closeOverlay} />}

                        {ov.screen === 'fallback' && <FallbackScreen label={ov.data} onBack={closeOverlay} />}
                    </div>
                );
            })}

            <Toast message={toast} show={!!toast} />
        </div>
    );
};

/* ============================================================
   ROOT APP — Onboarding -> App Shell
   ============================================================ */
const App = () => {
    const [appPhase, setAppPhase] = useState('onboarding'); // 'onboarding' | 'main'
    const [userData, setUserData] = useState(null);

    if (appPhase === 'onboarding') {
        return (
            <OnboardingFlow onComplete={(data) => { setUserData(data); setAppPhase('main'); }} />
        );
    }

    return (
        <AppShell
            userName={userData?.name || 'Budi'}
            onLogout={() => { setUserData(null); setAppPhase('onboarding'); }}
        />
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
